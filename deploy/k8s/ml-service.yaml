apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-service
  labels: { app: ml-service }
spec:
  replicas: 1 # bump + add GPU resources when USE_REAL_MODELS=true
  selector:
    matchLabels: { app: ml-service }
  template:
    metadata:
      labels: { app: ml-service }
    spec:
      containers:
        - name: ml-service
          image: secure-llm-gateway/ml-service:latest
          ports: [{ containerPort: 8100 }]
          env:
            - { name: USE_REAL_MODELS, value: "false" }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "1", memory: "1Gi" } # raise substantially for real models
          livenessProbe:
            httpGet: { path: /health, port: 8100 }
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /health, port: 8100 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ml-service
spec:
  selector: { app: ml-service }
  ports: [{ port: 8100, targetPort: 8100 }]
